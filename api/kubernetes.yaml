apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser-api
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-parser-api
  template:
    metadata:
      labels:
        app: command-parser-api
    spec:
      containers:
        - name: command-parser-api
          image: command-parser-api:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: command-parser-api
  namespace: pipeline
spec:
  type: ClusterIP
  selector:
    app: command-parser-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
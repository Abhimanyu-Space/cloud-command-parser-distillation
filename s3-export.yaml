apiVersion: v1
kind: Pod
metadata:
  name: s3-export
  namespace: pipeline
spec:
  restartPolicy: Never
  containers:
    - name: export
      image: command-parser-worker:1.0
      imagePullPolicy: IfNotPresent
      command: ["python", "-c"]
      args:
        - |
          import os, boto3
          s = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT"], region_name="us-east-1")
          for i in range(2):
              key = f"teacher/shard-{i}.jsonl"
              data = s.get_object(Bucket="datasets", Key=key)["Body"].read()
              path = f"/tmp/shard-{i}.jsonl"
              with open(path, "wb") as f:
                  f.write(data)
              print(f"Exported {key}: {len(data)} bytes", flush=True)
      env:
        - name: S3_ENDPOINT
          value: "http://seaweedfs.data.svc.cluster.local:8333"
      envFrom:
        - secretRef:
            name: s3-credentials
